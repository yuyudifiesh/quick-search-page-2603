<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>清人名单</title>
<style>
  *, *::before, *::after {
    box-sizing: border-box;
    -webkit-user-select: none;
    -moz-user-select: none;
    -ms-user-select: none;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }

  html, body {
    margin: 0;
    padding: 0;
    min-height: 100vh;
    background: #fff;
    color: #111;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                 "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  /* 隐藏滚动条（兼容各浏览器） */
  html, body {
    scrollbar-width: none;       /* Firefox */
    -ms-overflow-style: none;    /* IE/Edge */
  }
  html::-webkit-scrollbar,
  body::-webkit-scrollbar,
  *::-webkit-scrollbar {
    width: 0;
    height: 0;
    display: none;               /* Chrome/Safari */
  }

  body {
    padding: 48px 24px 80px;
  }

  .wrap { max-width: 1040px; margin: 0 auto; }

  /* ---------- 头部 ---------- */
  .head {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 16px;
    flex-wrap: wrap;
    padding-bottom: 14px;
    margin-bottom: 28px;
    border-bottom: 1px solid #111;
  }
  .head-left {
    display: flex;
    align-items: baseline;
    gap: 8px;
  }
  h1 {
    margin: 0;
    font-size: 18px;
    font-weight: 600;
    letter-spacing: .3em;
    text-indent: .3em;
  }
  /* 标题右侧的文本按钮 */
  .tool-link {
    font-size: 12px;
    letter-spacing: .08em;
    color: #999;
    text-decoration: none;
    cursor: pointer;
    transition: color .18s ease;
  }
  .tool-link:hover { color: #111; }
  .tool-link:focus-visible { outline: 2px solid #111; outline-offset: 2px; }

  .head-right {
    display: flex;
    align-items: center;
    gap: 12px;
    font-size: 12px;
    letter-spacing: .08em;
    color: #999;
  }
  .count { color: #111; font-variant-numeric: tabular-nums; }
  .count b { font-weight: 600; font-size: 14px; }

  .toolbar {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
    margin-bottom: 16px;
  }

  select {
    appearance: none;
    -webkit-appearance: none;
    -moz-appearance: none;
    border: 1px solid #111;
    background: #fff;
    color: #111;
    padding: 8px 32px 8px 10px;
    font-size: 12px;
    letter-spacing: .08em;
    min-width: 200px;
    max-width: 100%;
    background-image:
      linear-gradient(45deg, transparent 50%, #000 50%),
      linear-gradient(135deg, #000 50%, transparent 50%);
    background-position: calc(100% - 14px) calc(50% - 2px), calc(100% - 9px) calc(50% - 2px);
    background-size: 5px 5px, 5px 5px;
    background-repeat: no-repeat;
  }

  button {
    appearance: none;
    border: 1px solid #111;
    background: #fff;
    color: #111;
    font-size: 12px;
    letter-spacing: .08em;
    padding: 8px 12px;
    cursor: pointer;
    transition: background-color .18s ease, color .18s ease;
  }
  button:hover { background: #111; color: #fff; }
  button:disabled {
    opacity: .5;
    cursor: not-allowed;
  }

  .status {
    min-height: 18px;
    margin-bottom: 12px;
    font-size: 11px;
    letter-spacing: .08em;
    color: #666;
  }
  .status.err {
    color: #c00;
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(148px, 1fr));
    gap: 12px;
  }

  .card {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    height: 56px;
    padding: 0 30px;
    border: 1px solid #111;
    background: #fff;
    cursor: pointer;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
    transition: background-color .18s ease, border-color .18s ease;
  }
  .card:hover { background: #f4f4f4; }
  .card:active { transform: translateY(1px); }
  .card:focus-visible { outline: 2px solid #111; outline-offset: 2px; }

  .box {
    position: absolute;
    left: 12px;
    top: 50%;
    width: 14px;
    height: 14px;
    margin-top: -7px;
    border: 1px solid #111;
    background: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background-color .18s ease, border-color .18s ease;
  }
  .box::after {
    content: "";
    width: 3px;
    height: 7px;
    border-right: 1.5px solid #fff;
    border-bottom: 1.5px solid #fff;
    transform: rotate(45deg) scale(0);
    transition: transform .18s ease;
  }

  .name {
    position: relative;
    font-size: 15px;
    letter-spacing: .06em;
    white-space: nowrap;
    color: #111;
    transition: color .18s ease;
  }
  .name::after {
    content: "";
    position: absolute;
    left: -2px;
    top: 50%;
    height: 1px;
    width: 0;
    background: currentColor;
    transition: width .22s ease;
  }

  .card.done { background: #fafafa; border-color: #c9c9c9; }
  .card.done .box { background: #111; border-color: #111; }
  .card.done .box::after { transform: rotate(45deg) scale(1); }
  .card.done .name { color: #a3a3a3; }
  .card.done .name::after { width: calc(100% + 4px); }

  .foot {
    margin-top: 40px;
    text-align: center;
    font-size: 11px;
    letter-spacing: .22em;
    color: #ddd;
  }
</style>
</head>
<body>

<div class="wrap">
  <div class="head">
    <div class="head-left">
      <h1>名单</h1>
      <a class="tool-link"
         href="organize.html"
         rel="noopener">核对工具</a>
    </div>
    <div class="head-right">
      <span class="count">已清 <b id="done">0</b> / <span id="total">0</span></span>
      <div class="toolbar">
        <select id="presetSelect" disabled>
          <option value="">正在获取名单列表</option>
        </select>
        <button id="reloadPresets" type="button">刷新</button>
      </div>
    </div>
  </div>

  <div class="status" id="presetStatus"></div>
  <div class="grid" id="grid"></div>

  <p class="foot">刷新以重置选择</p>
</div>

<script>
  const PRESET_DIR = './datas/namelist/';
  const INDEX_FILE = 'index.json';
  const FETCH_TIMEOUT = 8000;

  const grid = document.getElementById('grid');
  const doneEl = document.getElementById('done');
  const totalEl = document.getElementById('total');
  const presetEl = document.getElementById('presetSelect');
  const statusEl = document.getElementById('presetStatus');
  const reloadBtn = document.getElementById('reloadPresets');

  let doneCount = 0;
  let activeNames = [];
  let presets = {};

  function fetchWithTimeout(url, options, ms) {
    const controller = new AbortController();
    const timer = setTimeout(function () { controller.abort(); }, ms || FETCH_TIMEOUT);
    return fetch(url, Object.assign({ cache: 'no-store' }, options || {}, {
      signal: controller.signal
    })).finally(function () { clearTimeout(timer); });
  }

  async function fetchJson(url) {
    const res = await fetchWithTimeout(url);
    if (!res.ok) throw new Error('HTTP ' + res.status);
    return res.json();
  }

  async function discoverFiles() {
    try {
      const idx = await fetchJson(PRESET_DIR + INDEX_FILE);
      let files = [];
      if (Array.isArray(idx)) files = idx;
      else if (idx && Array.isArray(idx.files)) files = idx.files;
      else if (idx && Array.isArray(idx.list)) files = idx.list;
      files = files
        .filter(function (f) { return typeof f === 'string' && f.trim(); })
        .map(function (f) { return f.trim(); });
      if (files.length) return files;
    } catch (e) {}

    try {
      const res = await fetchWithTimeout(PRESET_DIR);
      if (res.ok) {
        const html = await res.text();
        const doc = new DOMParser().parseFromString(html, 'text/html');
        const found = [];
        doc.querySelectorAll('a[href]').forEach(function (a) {
          const href = (a.getAttribute('href') || '').split('?')[0].split('#')[0];
          if (!/\.json$/i.test(href)) return;
          const name = decodeURIComponent(href.substring(href.lastIndexOf('/') + 1));
          if (name && name.toLowerCase() !== INDEX_FILE.toLowerCase()) found.push(name);
        });
        const unique = Array.from(new Set(found));
        if (unique.length) return unique;
      }
    } catch (e) {}

    throw new Error('NO_FILES');
  }

  function normalizePreset(data, filename) {
    const baseName = filename.replace(/\.json$/i, '');
    const out = [];

    function push(id, name, names) {
      if (!Array.isArray(names)) return;
      const cleaned = names
        .map(function (n) { return String(n == null ? '' : n).trim(); })
        .filter(function (n) { return n.length > 0; });
      if (!cleaned.length) return;
      out.push({
        id: String(id || baseName).trim() || baseName,
        name: String(name || id || baseName).trim() || baseName,
        names: cleaned
      });
    }

    function fromItem(item, fallbackId, fallbackName) {
      if (!item) return;
      if (typeof item === 'string') { push(fallbackId, fallbackName, [item]); return; }
      const id = item.id || item.key || fallbackId;
      const name = item.name || item.title || item.id || fallbackName;
      let names = item.names || item.list || item.members || item.students;
      if (!Array.isArray(names)) names = [];
      push(id, name, names);
    }

    if (Array.isArray(data)) {
      if (data.every(function (x) { return typeof x === 'string'; })) {
        push(baseName, baseName, data);
        return out;
      }
      data.forEach(function (item, i) {
        fromItem(item, baseName + '-' + (i + 1), baseName + ' ' + (i + 1));
      });
      return out;
    }

    if (data && typeof data === 'object') {
      if (Array.isArray(data.presets)) {
        data.presets.forEach(function (item, i) {
          fromItem(item, baseName + '-' + (i + 1), baseName + ' ' + (i + 1));
        });
        return out;
      }
      if (Array.isArray(data.names || data.list || data.members || data.students)) {
        fromItem(data, baseName, baseName);
        return out;
      }
      const keys = Object.keys(data);
      if (keys.length && keys.every(function (k) { return Array.isArray(data[k]); })) {
        keys.forEach(function (k) { push(k, k, data[k]); });
        return out;
      }
      if (keys.length && keys.every(function (k) {
        return data[k] && typeof data[k] === 'object' && !Array.isArray(data[k]);
      })) {
        keys.forEach(function (k) {
          const v = data[k];
          const names = v.names || v.list || v.members || v.students || [];
          push(v.id || k, v.name || k, names);
        });
      }
    }

    return out;
  }

  async function loadPresets() {
    presetEl.disabled = true;
    presetEl.innerHTML = '<option value="">— 加载中… —</option>';
    statusEl.className = 'status';
    statusEl.textContent = '正在读取 ' + PRESET_DIR + ' …';
    presets = {};

    let files = [];
    try {
      files = await discoverFiles();
    } catch (err) {
      presetEl.innerHTML = '<option value="">NaN</option>';
      statusEl.className = 'status err';
      statusEl.textContent = location.protocol === 'file:' ? '加载失败：请先启动本地服务器。' : '加载失败：无法获取名单文件列表。';
      return;
    }

    const results = await Promise.allSettled(
      files.map(function (file) {
        return fetchJson(PRESET_DIR + file).then(function (data) {
          return { file: file, data: data };
        });
      })
    );

    const failed = [];
    let loadedCount = 0;

    results.forEach(function (r, i) {
      const file = files[i];
      if (r.status === 'rejected') {
        failed.push(file + '（读取失败）');
        return;
      }
      const list = normalizePreset(r.value.data, file);
      if (!list.length) {
        failed.push(file + '（未解析出有效名单）');
        return;
      }
      list.forEach(function (item) {
        let id = item.id, base = id, n = 1;
        while (presets[id]) { id = base + '-' + (++n); }
        presets[id] = { name: item.name, names: item.names };
        loadedCount++;
      });
    });

    const keys = Object.keys(presets);
    if (!keys.length) {
      presetEl.innerHTML = '<option value="">— 暂无可用名单 —</option>';
      statusEl.className = 'status err';
      statusEl.textContent = '未加载到任何有效名单。';
      return;
    }

    presetEl.innerHTML = '<option value="">— 选择预选名单 —</option>';
    keys.forEach(function (id) {
      const opt = document.createElement('option');
      opt.value = id;
      opt.textContent = presets[id].name + '（' + presets[id].names.length + ' 人）';
      presetEl.appendChild(opt);
    });
    presetEl.disabled = false;

    statusEl.className = 'status';
    statusEl.textContent = '已加载 ' + loadedCount + ' 份名单' +
      (failed.length ? '；失败 ' + failed.length + ' 个：' + failed.join('；') : '');

    if (!presetEl.value) {
      applyNames([]);
    }
  }

  function renderNames(names) {
    grid.innerHTML = '';
    doneCount = 0;
    doneEl.textContent = '0';
    totalEl.textContent = String(names.length);

    names.forEach(function (name) {
      const card = document.createElement('div');
      card.className = 'card';
      card.setAttribute('role', 'checkbox');
      card.setAttribute('aria-checked', 'false');
      card.setAttribute('tabindex', '0');

      const box = document.createElement('span');
      box.className = 'box';
      box.setAttribute('aria-hidden', 'true');

      const label = document.createElement('span');
      label.className = 'name';
      label.textContent = name;

      card.append(box, label);
      card.addEventListener('click', function () { toggle(card); });
      card.addEventListener('keydown', function (e) {
        if (e.key === ' ' || e.key === 'Enter') {
          e.preventDefault();
          toggle(card);
        }
      });

      grid.appendChild(card);
    });
  }

  function applyNames(names) {
    activeNames = Array.isArray(names) ? names : [];
    renderNames(activeNames);
  }

  function toggle(card) {
    const isDone = card.classList.toggle('done');
    card.setAttribute('aria-checked', String(isDone));
    doneCount += isDone ? 1 : -1;
    doneEl.textContent = String(doneCount);
  }

  presetEl.addEventListener('change', function () {
    const key = presetEl.value;
    if (!key || !presets[key]) {
      applyNames([]);
      return;
    }
    applyNames(presets[key].names.slice());
  });

  reloadBtn.addEventListener('click', function () {
    loadPresets();
  });

  document.addEventListener('dragstart', function (e) { e.preventDefault(); });
  document.addEventListener('copy', function (e) { e.preventDefault(); });
  document.addEventListener('cut', function (e) { e.preventDefault(); });

  loadPresets();
</script>

</body>
</html>
