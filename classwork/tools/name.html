<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>清人名单</title>
<style>
  *, *::before, *::after {
    box-sizing: border-box;
    -webkit-user-select: none;
    -moz-user-select: none;
    -ms-user-select: none;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }

  html, body {
    margin: 0;
    padding: 0;
    min-height: 100vh;
    background: #fff;
    color: #111;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                 "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  /* 隐藏滚动条（兼容各浏览器） */
  html, body {
    scrollbar-width: none;       /* Firefox */
    -ms-overflow-style: none;    /* IE/Edge */
  }
  html::-webkit-scrollbar,
  body::-webkit-scrollbar,
  *::-webkit-scrollbar {
    width: 0;
    height: 0;
    display: none;               /* Chrome/Safari */
  }

  body {
    padding: 48px 24px 80px;
  }

  .wrap { max-width: 1040px; margin: 0 auto; }

  /* ---------- 头部 ---------- */
  .head {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 16px;
    flex-wrap: wrap;
    padding-bottom: 14px;
    margin-bottom: 28px;
    border-bottom: 1px solid #111;
  }
  .head-left {
    display: flex;
    align-items: baseline;
    gap: 8px;
  }
  h1 {
    margin: 0;
    font-size: 18px;
    font-weight: 600;
    letter-spacing: .3em;
    text-indent: .3em;
  }
  /* 标题右侧的文本按钮 */
  .tool-link {
    font-size: 12px;
    letter-spacing: .08em;
    color: #999;
    text-decoration: none;
    cursor: pointer;
    transition: color .18s ease;
  }
  .tool-link:hover { color: #111; }
  .tool-link:focus-visible { outline: 2px solid #111; outline-offset: 2px; }

  .head-right {
    display: flex;
    align-items: baseline;
    gap: 18px;
    font-size: 12px;
    letter-spacing: .08em;
    color: #999;
  }
  .count { color: #111; font-variant-numeric: tabular-nums; }
  .count b { font-weight: 600; font-size: 14px; }

  /* ---------- 网格 ---------- */
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(148px, 1fr));
    gap: 12px;
  }

  /* ---------- 卡片 ---------- */
  .card {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    height: 56px;
    padding: 0 30px;
    border: 1px solid #111;
    background: #fff;
    cursor: pointer;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
    transition: background-color .18s ease, border-color .18s ease;
  }
  .card:hover { background: #f4f4f4; }
  .card:active { transform: translateY(1px); }
  .card:focus-visible { outline: 2px solid #111; outline-offset: 2px; }

  /* 复选框 */
  .box {
    position: absolute;
    left: 12px;
    top: 50%;
    width: 14px;
    height: 14px;
    margin-top: -7px;
    border: 1px solid #111;
    background: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background-color .18s ease, border-color .18s ease;
  }
  .box::after {
    content: "";
    width: 3px;
    height: 7px;
    border-right: 1.5px solid #fff;
    border-bottom: 1.5px solid #fff;
    transform: rotate(45deg) scale(0);
    transition: transform .18s ease;
  }

  /* 姓名 */
  .name {
    position: relative;
    font-size: 15px;
    letter-spacing: .06em;
    white-space: nowrap;
    color: #111;
    transition: color .18s ease;
  }
  .name::after {
    content: "";
    position: absolute;
    left: -2px;
    top: 50%;
    height: 1px;
    width: 0;
    background: currentColor;
    transition: width .22s ease;
  }

  /* ---------- 已清除状态 ---------- */
  .card.done { background: #fafafa; border-color: #c9c9c9; }
  .card.done .box { background: #111; border-color: #111; }
  .card.done .box::after { transform: rotate(45deg) scale(1); }
  .card.done .name { color: #a3a3a3; }
  .card.done .name::after { width: calc(100% + 4px); }

  .foot {
    margin-top: 40px;
    text-align: center;
    font-size: 11px;
    letter-spacing: .22em;
    color: #ddd;
  }
</style>
</head>
<body>

<div class="wrap">
  <div class="head">
    <div class="head-left">
      <h1>名单</h1>
      <a class="tool-link"
         href="organize.html"
         rel="noopener">核对工具</a>
    </div>
    <div class="head-right">
      <span class="count">已清 <b id="done">0</b> / <span id="total">0</span></span>
    </div>
  </div>

  <div class="grid" id="grid"></div>

  <p class="foot">REFRESH TO RESET</p>
</div>

<script>
  const names = [
    "曹海洋","曾星宇","陈惠芸","程铠煦","戴训武","邓品雪","郭盈盈","韩瑾",
    "郝奕博","洪鑫","黄沛谕","蒋凌杰","赖宇翔","雷心怡","李程羽","李思源",
    "李星尘","廖新哲","刘鑫","刘怡馨","刘源铭","刘梓娇","罗政涛","聂于钧",
    "欧阳雨嫣","彭虎","全驿名","孙蒙","唐冰晗","唐伟明","陶思勇","万梁贝",
    "汪嘉伟","王瑾","王凯文","王诗慧","吴峰","吴颖","伍献永","肖兴平",
    "谢延锋","熊祉皓","徐筠茹","杨华川","易宇峰","张诗若","周隽文","邹芷涵",
    "左宸宇"
  ];

  const grid     = document.getElementById("grid");
  const doneEl   = document.getElementById("done");
  const totalEl  = document.getElementById("total");

  let doneCount = 0;

  names.forEach(name => {
    const card = document.createElement("div");
    card.className = "card";
    card.setAttribute("role", "checkbox");
    card.setAttribute("aria-checked", "false");
    card.setAttribute("tabindex", "0");

    const box = document.createElement("span");
    box.className = "box";
    box.setAttribute("aria-hidden", "true");

    const label = document.createElement("span");
    label.className = "name";
    label.textContent = name;

    card.append(box, label);

    card.addEventListener("click", () => toggle(card));
    card.addEventListener("keydown", e => {
      if (e.key === " " || e.key === "Enter") {
        e.preventDefault();
        toggle(card);
      }
    });

    grid.appendChild(card);
  });

  function toggle(card) {
    const isDone = card.classList.toggle("done");
    card.setAttribute("aria-checked", String(isDone));
    doneCount += isDone ? 1 : -1;
    doneEl.textContent = doneCount;
  }

  totalEl.textContent = names.length;

  /* 阻止拖拽选中与右键菜单复制（增强不可选中） */
  document.addEventListener("dragstart", e => e.preventDefault());
  document.addEventListener("copy", e => e.preventDefault());
  document.addEventListener("cut", e => e.preventDefault());
</script>

</body>
</html>
