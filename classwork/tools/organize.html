<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>名单核对</title>
<style>
  :root{
    --ink:#000;
    --paper:#fff;
    --gray:#8a8a8a;
    --soft:#f7f7f7;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .app{max-width:1180px;margin:0 auto;padding:28px 20px 64px;}

  /* ---------- 顶部 ---------- */
  .head{
    display:flex;align-items:flex-end;justify-content:space-between;gap:16px;
    border-bottom:2px solid var(--ink);padding-bottom:14px;margin-bottom:22px;
  }
  .head h1{margin:0;font-size:21px;font-weight:700;letter-spacing:4px;}
  .head .en{
    font-family:ui-monospace,Menlo,Consolas,monospace;
    font-size:11px;letter-spacing:3px;color:var(--gray);
    padding-bottom:3px;
  }

  /* ---------- 布局 ---------- */
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;align-items:stretch;}
  @media (max-width:860px){
    .grid{grid-template-columns:1fr;}
  }

  .panel{
    border:1px solid var(--ink);
    padding:16px;
    display:flex;flex-direction:column;gap:12px;
    background:var(--paper);
  }
  .panel-head{
    display:flex;align-items:center;gap:10px;
    border-bottom:1px solid var(--ink);padding-bottom:8px;
  }
  .panel-head .idx{
    font-family:ui-monospace,Menlo,Consolas,monospace;
    font-size:11px;line-height:1;border:1px solid var(--ink);
    padding:3px 5px;
  }
  .panel-head h2{margin:0;font-size:14px;font-weight:600;letter-spacing:3px;}
  .panel-head .hint{
    margin-left:auto;font-size:11px;color:var(--gray);letter-spacing:1px;
    font-family:ui-monospace,Menlo,Consolas,monospace;
  }

  /* ---------- 控件 ---------- */
  .toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;}

  button{
    font-family:inherit;font-size:13px;letter-spacing:2px;
    padding:9px 16px;border:1px solid var(--ink);background:var(--paper);color:var(--ink);
    cursor:pointer;transition:background .15s ease,color .15s ease;
  }
  button:hover{background:var(--ink);color:var(--paper);}
  button.solid{background:var(--ink);color:var(--paper);}
  button.solid:hover{background:var(--paper);color:var(--ink);}
  button:active{transform:translateY(1px);}
  button:disabled{color:#bbb;border-color:#bbb;background:var(--paper);cursor:not-allowed;transform:none;}

  select{
    font-family:inherit;font-size:13px;letter-spacing:1px;
    padding:9px 32px 9px 10px;border:1px solid var(--ink);background-color:var(--paper);
    color:var(--ink);cursor:pointer;appearance:none;-webkit-appearance:none;
    background-image:
      linear-gradient(45deg, transparent 50%, #000 50%),
      linear-gradient(135deg, #000 50%, transparent 50%);
    background-position: calc(100% - 17px) 50%, calc(100% - 12px) 50%;
    background-size: 5px 5px, 5px 5px;
    background-repeat: no-repeat;
    outline:none;
    max-width:100%;
  }
  select:focus{box-shadow:inset 0 0 0 1px var(--ink);}
  select:disabled{color:#aaa;cursor:not-allowed;background-image:none;}

  textarea{
    width:100%;
    min-height:300px;
    flex:1;
    resize:vertical;
    border:1px solid var(--ink);
    padding:12px;
    background:var(--paper);
    color:var(--ink);
    font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"PingFang SC","Microsoft YaHei",monospace;
    font-size:14px;
    line-height:1.9;
    outline:none;
  }
  textarea:focus{box-shadow:inset 0 0 0 1px var(--ink);}
  textarea::placeholder{color:#bdbdbd;}

  .meta{
    display:flex;justify-content:space-between;align-items:center;
    font-size:11px;color:var(--gray);letter-spacing:1px;
    font-family:ui-monospace,Menlo,Consolas,monospace;
  }

  /* ---------- 加载状态 ---------- */
  .status{
    font-size:11px;letter-spacing:1px;line-height:1.7;
    font-family:ui-monospace,Menlo,Consolas,monospace;
    color:var(--gray);
  }
  .status:empty{display:none;}
  .status.err{
    color:var(--ink);
    border:1px dashed var(--ink);
    background:var(--soft);
    padding:8px 10px;
  }

  /* ---------- 结果 ---------- */
  .result{display:flex;flex-direction:column;gap:14px;}
  .result:empty{display:none;}

  .stats{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--ink);}
  .stat{padding:10px 6px;text-align:center;border-right:1px solid var(--ink);}
  .stat:last-child{border-right:none;}
  .stat .num{
    display:block;font-size:22px;font-weight:700;line-height:1.2;
    font-family:ui-monospace,Menlo,Consolas,monospace;
  }
  .stat .label{display:block;font-size:11px;color:#666;letter-spacing:1px;margin-top:2px;}
  @media (max-width:520px){
    .stats{grid-template-columns:repeat(2,1fr);}
    .stat:nth-child(2){border-right:none;}
    .stat:nth-child(1),.stat:nth-child(2){border-bottom:1px solid var(--ink);}
  }

  .block{border-top:1px solid var(--ink);padding-top:10px;}
  .block:first-child{border-top:none;padding-top:0;}
  .block-head{
    display:flex;justify-content:space-between;align-items:center;
    font-size:12px;letter-spacing:2px;margin-bottom:8px;
  }
  .block-head .count{
    font-family:ui-monospace,Menlo,Consolas,monospace;
    font-size:11px;border:1px solid var(--ink);padding:1px 6px;letter-spacing:0;
  }

  .tags{display:flex;flex-wrap:wrap;gap:6px;}
  .tag{
    font-size:13px;line-height:1.6;padding:3px 9px;border:1px solid var(--ink);
    display:inline-flex;align-items:center;gap:5px;
  }
  .tag em{
    font-style:normal;font-size:11px;color:#777;
    font-family:ui-monospace,Menlo,Consolas,monospace;
  }
  .tag.miss{border-style:dashed;background:var(--soft);}

  .notice{
    border:1px dashed var(--ink);padding:12px;text-align:center;
    font-size:13px;letter-spacing:1px;color:#444;background:var(--soft);
  }
</style>
</head>
<body>
<div class="app">

  <div class="head">
    <h1>名单核对</h1>
  </div>

  <div class="grid">

    <!-- ============ 左：名单 ============ -->
    <section class="panel">
      <div class="panel-head">
        <span class="idx">01</span>
        <h2>名单</h2>
        <span class="hint">每行一个姓名</span>
      </div>

      <div class="toolbar">
        <select id="presetSelect" disabled>
          <option value="">正在获取名单列表</option>
        </select>
        <button id="reloadPresets" type="button">刷新</button>
        <button id="clearList" type="button">清空</button>
      </div>

      <div class="status" id="presetStatus"></div>

      <textarea id="nameList" placeholder="在此输入姓名，每行一个&#10;例如：&#10;张三&#10;李四"></textarea>

      <div class="meta">
        <span id="listCount">0 人</span>
        <span>LIST</span>
      </div>
    </section>

    <!-- ============ 右：文本 ============ -->
    <section class="panel">
      <div class="panel-head">
        <span class="idx">02</span>
        <h2>比对文本</h2>
        <span class="hint">粘贴任意内容</span>
      </div>

      <textarea id="textInput" placeholder="在此粘贴任意文本内容，例如聊天记录、报名表、签到表……&#10;&#10;点击下方「开始比对」按钮进行核对"></textarea>

      <div class="toolbar">
        <button class="solid" id="runBtn" type="button">开始比对</button>
        <button id="clearText" type="button">清空文本</button>
      </div>

      <div class="result" id="result"></div>
    </section>

  </div>
</div>

<script>
(function () {
  'use strict';
  const PRESET_DIR  = './datas/namelist/';
  const INDEX_FILE  = 'index.json';
  const FETCH_TIMEOUT = 8000;

  /* ---------- DOM ---------- */
  const listEl      = document.getElementById('nameList');
  const textEl      = document.getElementById('textInput');
  const presetEl    = document.getElementById('presetSelect');
  const statusEl    = document.getElementById('presetStatus');
  const reloadBtn   = document.getElementById('reloadPresets');
  const resultEl    = document.getElementById('result');
  const listCountEl = document.getElementById('listCount');

  /* 已加载的预选名单： id -> { name, names: [] } */
  let presets = {};

  /* =========================================================
   *  fetch 辅助
   * ========================================================= */
  function fetchWithTimeout(url, options, ms) {
    const controller = new AbortController();
    const timer = setTimeout(function () { controller.abort(); }, ms || FETCH_TIMEOUT);
    return fetch(url, Object.assign({ cache: 'no-store' }, options || {}, {
      signal: controller.signal
    })).finally(function () { clearTimeout(timer); });
  }

  async function fetchJson(url) {
    const res = await fetchWithTimeout(url);
    if (!res.ok) throw new Error('HTTP ' + res.status);
    return res.json();
  }

  /* =========================================================
   *  自动发现名单文件
   *   1) 优先读取 datas/namelist/index.json 清单
   *   2) 其次尝试解析服务器返回的目录列表 HTML
   * ========================================================= */
  async function discoverFiles() {
    /* ---- 1. index.json 清单 ---- */
    try {
      const idx = await fetchJson(PRESET_DIR + INDEX_FILE);
      let files = [];
      if (Array.isArray(idx)) files = idx;
      else if (idx && Array.isArray(idx.files)) files = idx.files;
      else if (idx && Array.isArray(idx.list)) files = idx.list;
      files = files
        .filter(function (f) { return typeof f === 'string' && f.trim(); })
        .map(function (f) { return f.trim(); });
      if (files.length) return files;
    } catch (e) { /* 继续尝试目录列表 */ }

    /* ---- 2. 目录列表 ---- */
    try {
      const res = await fetchWithTimeout(PRESET_DIR);
      if (res.ok) {
        const html = await res.text();
        const doc  = new DOMParser().parseFromString(html, 'text/html');
        const found = [];
        doc.querySelectorAll('a[href]').forEach(function (a) {
          const href = (a.getAttribute('href') || '').split('?')[0].split('#')[0];
          if (!/\.json$/i.test(href)) return;
          const name = decodeURIComponent(href.substring(href.lastIndexOf('/') + 1));
          if (name && name.toLowerCase() !== INDEX_FILE.toLowerCase()) {
            found.push(name);
          }
        });
        const unique = Array.from(new Set(found));
        if (unique.length) return unique;
      }
    } catch (e) { /* 继续 */ }

    throw new Error('NO_FILES');
  }

  /* =========================================================
   *  单文件 -> 名单对象数组
   *  兼容多种 JSON 结构
   * ========================================================= */
  function normalizePreset(data, filename) {
    const baseName = filename.replace(/\.json$/i, '');
    const out = [];

    function push(id, name, names) {
      if (!Array.isArray(names)) return;
      const cleaned = names
        .map(function (n) { return String(n == null ? '' : n).trim(); })
        .filter(function (n) { return n.length > 0; });
      if (!cleaned.length) return;
      out.push({
        id:   String(id   || baseName).trim() || baseName,
        name: String(name || id || baseName).trim() || baseName,
        names: cleaned
      });
    }

    function fromItem(item, fallbackId, fallbackName) {
      if (!item) return;
      if (typeof item === 'string') { push(fallbackId, fallbackName, [item]); return; }
      const id   = item.id   || item.key   || fallbackId;
      const name = item.name || item.title || item.id || fallbackName;
      let names  = item.names || item.list || item.members || item.students;
      if (!Array.isArray(names)) names = [];
      push(id, name, names);
    }

    /* 顶层：数组 */
    if (Array.isArray(data)) {
      /* 纯字符串数组 -> 视为一份名单 */
      if (data.every(function (x) { return typeof x === 'string'; })) {
        push(baseName, baseName, data);
        return out;
      }
      /* 对象数组 -> 多份名单 */
      data.forEach(function (item, i) {
        fromItem(item, baseName + '-' + (i + 1), baseName + ' ' + (i + 1));
      });
      return out;
    }

    /* 顶层：对象 */
    if (data && typeof data === 'object') {
      /* { presets: [ ... ] } */
      if (Array.isArray(data.presets)) {
        data.presets.forEach(function (item, i) {
          fromItem(item, baseName + '-' + (i + 1), baseName + ' ' + (i + 1));
        });
        return out;
      }
      /* { id, name, names: [...] } */
      if (Array.isArray(data.names || data.list || data.members || data.students)) {
        fromItem(data, baseName, baseName);
        return out;
      }
      /* { "名称1": [...], "名称2": [...] } */
      const keys = Object.keys(data);
      if (keys.length && keys.every(function (k) { return Array.isArray(data[k]); })) {
        keys.forEach(function (k) { push(k, k, data[k]); });
        return out;
      }
      /* { "名称1": { names: [...] }, ... } */
      if (keys.length && keys.every(function (k) {
        return data[k] && typeof data[k] === 'object' && !Array.isArray(data[k]);
      })) {
        keys.forEach(function (k) {
          const v = data[k];
          const names = v.names || v.list || v.members || v.students || [];
          push(v.id || k, v.name || k, names);
        });
      }
    }

    return out;
  }

  /* =========================================================
   *  加载全部名单
   * ========================================================= */
  async function loadPresets() {
    presetEl.disabled = true;
    presetEl.innerHTML = '<option value="">— 加载中… —</option>';
    statusEl.className = 'status';
    statusEl.textContent = '正在读取 ' + PRESET_DIR + ' …';
    presets = {};

    let files = [];
    try {
      files = await discoverFiles();
    } catch (err) {
      presetEl.innerHTML = '<option value="">NaN</option>';
      statusEl.className = 'status err';

      if (location.protocol === 'file:') {
        statusEl.innerHTML =
          '加载失败：请先启动本地服务器。';
      } else {
        statusEl.innerHTML =
          '加载失败：无法获取名单文件列表。';
      }
      return;
    }

    /* 逐个加载 */
    const results = await Promise.allSettled(
      files.map(function (file) {
        return fetchJson(PRESET_DIR + file).then(function (data) {
          return { file: file, data: data };
        });
      })
    );

    const failed = [];
    const loadedNames = [];
    let loadedCount = 0;

    results.forEach(function (r, i) {
      const file = files[i];
      if (r.status === 'rejected') {
        const msg = (r.reason && r.reason.message) ? r.reason.message : '读取失败';
        failed.push(file + '（' + msg + '）');
        return;
      }
      const list = normalizePreset(r.value.data, file);
      if (!list.length) {
        failed.push(file + '（未解析出有效名单）');
        return;
      }
      list.forEach(function (item) {
        let id = item.id, base = id, n = 1;
        while (presets[id]) { id = base + '-' + (++n); }
        presets[id] = { name: item.name, names: item.names };
        loadedNames.push(item.name);
        loadedCount++;
      });
    });

    const keys = Object.keys(presets);

    if (!keys.length) {
      presetEl.innerHTML = '<option value="">— 暂无可用名单 —</option>';
      statusEl.className = 'status err';
      statusEl.innerHTML =
        '未加载到任何有效名单。' +
        (failed.length ? '<br>失败详情：' + failed.join('；') : '');
      return;
    }

    presetEl.innerHTML = '<option value="">— 选择预选名单 —</option>';
    keys.forEach(function (id) {
      const opt = document.createElement('option');
      opt.value = id;
      opt.textContent = presets[id].name + '（' + presets[id].names.length + ' 人）';
      presetEl.appendChild(opt);
    });
    presetEl.disabled = false;

    statusEl.className = 'status';
    statusEl.textContent = '已加载 ' + loadedCount + ' 份名单' +
      (failed.length ? '；失败 ' + failed.length + ' 个：' + failed.join('；') : '');
  }

  /* =========================================================
   *  工具函数
   * ========================================================= */
  function parseNames(str) {
    return str
      .split(/[\n\r,，、;；\t]+/)
      .map(function (s) { return s.trim(); })
      .filter(function (s) { return s.length > 0; });
  }

  function countOccurrences(text, name) {
    if (!name) return 0;
    let count = 0, idx = 0;
    while ((idx = text.indexOf(name, idx)) !== -1) {
      count++;
      idx += name.length;
    }
    return count;
  }

  function esc(s) {
    return s.replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  function updateListCount() {
    const n = parseNames(listEl.value).length;
    listCountEl.textContent = n ? n + ' 人' : '0 人';
  }

  /* =========================================================
   *  比对
   * ========================================================= */
  function compare() {
    const raw  = parseNames(listEl.value);
    const text = textEl.value;

    if (raw.length === 0) {
      resultEl.innerHTML = '<div class="notice">请先在左侧输入名单，或选择一个预选名单</div>';
      return;
    }
    if (text.trim().length === 0) {
      resultEl.innerHTML = '<div class="notice">请先在右侧粘贴要核对的文本内容</div>';
      return;
    }

    const seen = new Set(), uniq = [], dup = [];
    raw.forEach(function (n) {
      if (seen.has(n)) dup.push(n);
      else { seen.add(n); uniq.push(n); }
    });

    const found = [], missing = [];
    let totalOcc = 0;

    uniq.forEach(function (name) {
      const c = countOccurrences(text, name);
      if (c > 0) {
        found.push({ name: name, count: c });
        totalOcc += c;
      } else {
        missing.push(name);
      }
    });

    function stat(num, label) {
      return '<div class="stat"><span class="num">' + num +
             '</span><span class="label">' + label + '</span></div>';
    }

    let html = '<div class="stats">' +
      stat(uniq.length, '名单人数') +
      stat(found.length, '已找到') +
      stat(missing.length, '未找到') +
      stat(totalOcc, '出现总次数') +
      '</div>';

    html += '<div class="block">' +
      '<div class="block-head"><span>缺失名单</span><span class="count">' + missing.length + '</span></div>';
    if (missing.length) {
      html += '<div class="tags">' + missing.map(function (n) {
        return '<span class="tag miss">' + esc(n) + '</span>';
      }).join('') + '</div>';
    } else {
      html += '<div class="notice">全员到齐 ✓</div>';
    }
    html += '</div>';

    if (found.length) {
      html += '<div class="block">' +
        '<div class="block-head"><span>已找到</span><span class="count">' + found.length + '</span></div>' +
        '<div class="tags">' + found.map(function (f) {
          return '<span class="tag">' + esc(f.name) +
                 (f.count > 1 ? '<em>×' + f.count + '</em>' : '') + '</span>';
        }).join('') + '</div></div>';
    }

    if (dup.length) {
      html += '<div class="block">' +
        '<div class="block-head"><span>名单内重复</span><span class="count">' + dup.length + '</span></div>' +
        '<div class="tags">' + dup.map(function (n) {
          return '<span class="tag">' + esc(n) + '</span>';
        }).join('') + '</div></div>';
    }

    resultEl.innerHTML = html;
  }

  /* =========================================================
   *  事件绑定
   * ========================================================= */
  presetEl.addEventListener('change', function () {
    const key = presetEl.value;
    if (key && presets[key]) {
      listEl.value = presets[key].names.join('\n');
      updateListCount();
      resultEl.innerHTML = '';
      statusEl.className = 'status';
      statusEl.textContent = '已载入「' + presets[key].name + '」，共 ' + presets[key].names.length + ' 人';
    }
  });

  reloadBtn.addEventListener('click', function () { loadPresets(); });

  document.getElementById('clearList').addEventListener('click', function () {
    listEl.value = '';
    presetEl.value = '';
    updateListCount();
    resultEl.innerHTML = '';
    listEl.focus();
  });

  document.getElementById('clearText').addEventListener('click', function () {
    textEl.value = '';
    resultEl.innerHTML = '';
    textEl.focus();
  });

  document.getElementById('runBtn').addEventListener('click', compare);

  listEl.addEventListener('input', updateListCount);

  document.addEventListener('keydown', function (e) {
    if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
      e.preventDefault();
      compare();
    }
  });

  /* 初始 */
  updateListCount();
  loadPresets();
})();
</script>
</body>
</html>
